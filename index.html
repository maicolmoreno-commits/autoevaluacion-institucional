    function getLevelLabel(score) {
      const value = Number(score || 0);
      if (value >= 4.6) return "5 - Sobresaliente / Líder";
      if (value >= 3.6) return "4 - Excelente";
      if (value >= 2.6) return "3 - Consolidado";
      if (value >= 1.6) return "2 - En desarrollo";
      return "1 - Inicial";
    }

    function getScoreColor(score) {
      const value = Number(score || 1);
      if (value < 2.0) return "bg-red-500";
      if (value < 3.0) return "bg-orange-500";
      if (value < 4.0) return "bg-yellow-500";
      if (value < 4.6) return "bg-blue-500";
      return "bg-emerald-500";
    }

    function getScoreTextColor(score) {
      const value = Number(score || 1);
      if (value < 2.0) return "text-red-600";
      if (value < 3.0) return "text-orange-600";
      if (value < 4.0) return "text-yellow-600";
      if (value < 4.6) return "text-blue-600";
      return "text-emerald-600";
    }

    function parseAIJson(rawText, fallback = {}) {
      if (!rawText) return fallback;
      try {
        return JSON.parse(rawText);
      } catch (_) {
        const match = String(rawText).match(/\{[\s\S]*\}/);
        if (match) {
          try {
            return JSON.parse(match[0]);
          } catch (__) {}
        }
      }
      return fallback;
    }

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("No se pudo leer el archivo."));
        reader.onload = () => {
          const result = String(reader.result || "");
          resolve(result.includes(",") ? result.split(",")[1] : result);
        };
        reader.readAsDataURL(file);
      });
    }

    function Dashboard({ assessmentsList, onNavigate, onCallAI, isAdmin, onOpenAISettings }) {
      const [executiveSummary, setExecutiveSummary] = useState("");
      const [summaryLoading, setSummaryLoading] = useState(false);

      const factorScores = useMemo(() => {
        return FULL_DATA.map((factor) => {
          let totalScore = 0;
          let totalAdminScore = 0;
          let answeredCount = 0;

          factor.characteristics.forEach((char) => {
            const charAssessments = assessmentsList.filter((a) => a.charId === char.id);
            if (charAssessments.length > 0) {
              const latest = charAssessments[0];
              totalScore += Number(latest.score || 0);
              if (latest.adminScore) totalAdminScore += Number(latest.adminScore || 0);
              answeredCount++;
            }
          });

          const progress = factor.characteristics.length > 0 ? (answeredCount / factor.characteristics.length) * 100 : 0;
          return {
            ...factor,
            progress,
            avgNumericScore: answeredCount > 0 ? totalScore / answeredCount : 0,
            avgAdminScore: answeredCount > 0 ? totalAdminScore / answeredCount : 0,
            answeredCount
          };
        });
      }, [assessmentsList]);

      const globalProgress = factorScores.reduce((acc, curr) => acc + curr.progress, 0) / FULL_DATA.length;
      const evaluated = factorScores.filter((f) => f.answeredCount > 0);
      const globalNumericScore = evaluated.length > 0
        ? evaluated.reduce((acc, curr) => acc + curr.avgNumericScore, 0) / evaluated.length
        : 0;

      const handleGenerateSummary = async () => {
        setSummaryLoading(true);
        setExecutiveSummary("");

        const strongest = factorScores.filter(f => f.avgNumericScore >= 4.0).map(f => f.title).join(", ") || "Ninguno";
        const critical = factorScores.filter(f => f.avgNumericScore < 2.5 && f.answeredCount > 0).map(f => f.title).join(", ") || "Ninguno";

        const prompt = `Actúa como auditor experto de acreditación institucional. Genera un resumen ejecutivo estratégico basado en:
- Progreso de autoevaluación: ${globalProgress.toFixed(0)}%.
- Nota promedio de profesores: ${globalNumericScore.toFixed(2)} sobre 5.0.
- Factores fuertes detectados: ${strongest}.
- Factores críticos detectados: ${critical}.
Incluye recomendaciones estratégicas institucionales concretas, en lenguaje formal y claro.`;

        const response = await onCallAI(prompt);
        setExecutiveSummary(response || "No fue posible generar el resumen.");
        setSummaryLoading(false);
      };

      return (
        <div className="p-6 max-w-6xl mx-auto">
          <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-6">
            <div>

              </h2>
              <p className="text-sm text-gray-500 mt-1">
                {isAdmin ? "Vista consolidada de administrador." : "Vista de tus evaluaciones registradas."}
              </p>
            </div>
            <button onClick={handleGenerateSummary} disabled={summaryLoading} className="bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400 text-white px-5 py-2.5 rounded-lg font-medium shadow-md transition-all flex items-center">
              {summaryLoading ? <Loader2 size={18} className="animate-spin mr-2" /> : <Sparkles size={18} className="mr-2 text-yellow-300" />}
              Resumen IA
            </button>
          </div>

          {executiveSummary && (
            <div className="bg-gradient-to-r from-indigo-50 to-blue-50 p-6 rounded-xl shadow-sm border border-indigo-200 mb-8">
              <h3 className="font-bold text-indigo-900 flex items-center mb-3">
                <Sparkles size={20} className="mr-2 text-indigo-600" /> Insights generados por IA
              </h3>
              <div className="text-indigo-900 text-sm leading-relaxed whitespace-pre-wrap">{executiveSummary}</div>
            </div>
          )}

          <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div className="bg-white p-6 rounded-xl shadow-md border-l-4 border-blue-600">
              <h3 className="text-gray-500 font-medium text-sm">Progreso Global</h3>
              <p className="text-3xl font-bold text-gray-800 mt-2">{globalProgress.toFixed(1)}%</p>
              <div className="w-full bg-gray-200 rounded-full h-2 mt-4">
                <div className="bg-blue-600 h-2 rounded-full transition-all" style={{ width: `${globalProgress}%` }}></div>
              </div>
            </div>
            <div className="bg-white p-6 rounded-xl shadow-md border-l-4 border-indigo-600">
              <h3 className="text-gray-500 font-medium text-sm">Nota Promedio Profesor</h3>
              <p className="text-3xl font-extrabold text-indigo-700 mt-2">{globalNumericScore.toFixed(2)} <span className="text-sm font-semibold text-gray-400">/ 5.0</span></p>
            </div>
            <div className="bg-white p-6 rounded-xl shadow-md border-l-4 border-emerald-500">

              <p className="text-3xl font-bold text-gray-800 mt-2">{factorScores.filter(f => f.avgNumericScore >= 4.0 && f.answeredCount > 0).length}</p>
            </div>
            <div className="bg-white p-6 rounded-xl shadow-md border-l-4 border-red-500">
              <h3 className="text-gray-500 font-medium text-sm">Factores Críticos</h3>
              <p className="text-3xl font-bold text-gray-800 mt-2">{factorScores.filter(f => f.avgNumericScore < 2.5 && f.answeredCount > 0).length}</p>
            </div>
          </div>

          <div className="bg-white rounded-xl shadow-md overflow-hidden">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="bg-gray-50 border-b border-gray-200">

                    <td className="p-4 text-center">{factor.progress.toFixed(0)}%</td>

                        factor.avgNumericScore >= 4.0 ? 'bg-emerald-100 text-emerald-800' :
                        factor.avgNumericScore >= 3.0 ? 'bg-blue-100 text-blue-800' :
                        factor.answeredCount > 0 ? 'bg-yellow-100 text-yellow-800' : 'bg-gray-100 text-gray-600'
                      }`}>
                        {factor.answeredCount > 0 ? `${factor.avgNumericScore.toFixed(2)} / 5.0` : 'N/A'}
                      </span>
                    </td>
                    <td className="p-4 text-center">
                      <button onClick={() => onNavigate(idx)} className="text-blue-600 hover:text-blue-800 font-medium text-sm inline-flex items-center justify-center">
                        Evaluar <ChevronRight size={16} className="ml-1"/>
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

              <div>
                <h2 className="font-bold text-lg">Acceso restringido</h2>
                <p className="text-sm mt-1">Este panel solo puede verlo el correo administrador autorizado.</p>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="p-6 max-w-6xl mx-auto">
          <h2 className="text-3xl font-bold text-gray-800 flex items-center mb-6">
            <UserCog className="mr-3 text-emerald-600" /> Panel de Administrador Institucional
          </h2>

          <div className="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200">
            <table className="w-full text-left border-collapse text-sm">
              <thead>
                <tr className="bg-gray-100 border-b border-gray-200">
                  <th className="p-4 font-semibold text-gray-700">Profesor</th>
                  <th className="p-4 font-semibold text-gray-700">Característica</th>
                  <th className="p-4 font-semibold text-gray-700 text-center">Nota Profe</th>
                  <th className="p-4 font-semibold text-gray-700 text-center">Nota Admin</th>
                  <th className="p-4 font-semibold text-gray-700 text-center">Acción</th>
                </tr>
              </thead>
              <tbody>
                {assessmentsList.map((record) => (
                  <tr key={record.id} className="border-b border-gray-100 hover:bg-gray-50">
                    <td className="p-4 font-medium text-blue-800">
                      {record.profName || "Sin nombre"}
                      <div className="text-xs text-gray-500">{record.userEmail || ""}</div>
                    </td>
                    <td className="p-4 text-gray-600">
                      <div className="font-semibold text-gray-800 truncate max-w-xs" title={record.charTitle}>{record.charTitle}</div>
                      <div className="text-xs">{record.factorTitle}</div>
                    </td>
                    <td className="p-4 text-center font-bold text-blue-600">{record.score || '-'}</td>
                    <td className="p-4 text-center">
                      {record.adminScore ? (
                        <span className="bg-emerald-100 text-emerald-800 px-3 py-1 rounded font-bold">{parseFloat(record.adminScore).toFixed(1)}</span>
                      ) : (
                        <span className="text-gray-400 italic">Pendiente</span>
                      )}
                    </td>
                    <td className="p-4 text-center">
                      <button
                        onClick={() => {
                          const fIdx = FULL_DATA.findIndex(f => f.id === record.factorId);
                          if (fIdx >= 0) {
                            const cIdx = FULL_DATA[fIdx].characteristics.findIndex(c => c.id === record.charId);
                            if (cIdx >= 0) onReview(record, fIdx, cIdx);
                          }
                        }}
                        className="text-emerald-700 hover:text-emerald-900 font-medium bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-lg inline-flex items-center"
                      >
                        Revisar <ChevronRight size={14} className="ml-1"/>
                      </button>
                    </td>
                  </tr>
                ))}
                {assessmentsList.length === 0 && (
                  <tr><td colSpan="5" className="p-8 text-center text-gray-500">No hay evaluaciones enviadas todavía.</td></tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function AutoevaluacionMAAC() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [authError, setAuthError] = useState("");
      const [mode, setMode] = useState("profesor");
      const [view, setView] = useState("assessment");
      const [activeFactorIndex, setActiveFactorIndex] = useState(0);
      const [activeCharIndex, setActiveCharIndex] = useState(0);
      const [activeTab, setActiveTab] = useState("notes");
      const [profName, setProfName] = useState("Profesor");
      const [selectedRecordId, setSelectedRecordId] = useState(null);
      const [assessmentsList, setAssessmentsList] = useState([]);
      const [currentForm, setCurrentForm] = useState(defaultForm);
      const [isSaving, setIsSaving] = useState(false);
      const [saveMessage, setSaveMessage] = useState("");
      const [chatHistory, setChatHistory] = useState([]);
      const [chatInput, setChatInput] = useState("");
      const [chatLoading, setChatLoading] = useState(false);
      const [geminiKey, setGeminiKey] = useState(localStorage.getItem(GEMINI_API_KEY_STORAGE) || "");
      const [showAISettings, setShowAISettings] = useState(false);
      const [aiError, setAiError] = useState("");
      const chatEndRef = useRef(null);

      const isAdmin = user ? isAdminEmail(user.email) : false;
      const role = isAdmin ? mode : "profesor";
      const activeFactor = FULL_DATA[activeFactorIndex];
      const activeChar = activeFactor.characteristics[activeCharIndex];

      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (firebaseUser) => {
          setUser(firebaseUser);
          if (firebaseUser) {
            setProfName(firebaseUser.displayName || firebaseUser.email || "Profesor");
            if (!isAdminEmail(firebaseUser.email)) {
              setMode("profesor");
              setView("assessment");
            }
          }
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;

        const collectionRef = collection(db, ...DATA_PATH);
        const q = isAdmin
          ? query(collectionRef)
          : query(collectionRef, where("userId", "==", user.uid));

        const unsubscribe = onSnapshot(q, (snapshot) => {
          const data = snapshot.docs.map((snap) => ({ id: snap.id, ...snap.data() }));
          data.sort((a, b) => String(b.updatedAt?.seconds || "").localeCompare(String(a.updatedAt?.seconds || "")));
          setAssessmentsList(data);
        }, (error) => {
          console.error("Firestore error", error);
          setSaveMessage("No se pudieron leer los registros. Revisa las reglas de Firestore.");
        });

        return () => unsubscribe();
      }, [user, isAdmin]);

      useEffect(() => {
        if (!user) return;
        if (!isAdmin && view === "adminPanel") {
          setView("assessment");
          setMode("profesor");
        }
      }, [user, isAdmin, view]);

      useEffect(() => {
        if (!user) return;

        const existingRecord = role === "admin"
          ? assessmentsList.find(a => a.id === selectedRecordId || (a.charId === activeChar.id && a.profName === profName))
          : assessmentsList.find(a => a.charId === activeChar.id && a.userId === user.uid);

        if (existingRecord) {
          setCurrentForm({
            score: existingRecord.score || 1.0,
            aiSuggestedScore: existingRecord.aiSuggestedScore || 0,
            fortalezas: existingRecord.fortalezas || "",
            oportunidades: existingRecord.oportunidades || "",
            planMejoramiento: existingRecord.planMejoramiento || "",
            documentInsights: existingRecord.documentInsights || "",
            fileName: existingRecord.fileName || "",
            isAnalyzingFile: false,
            adminScore: existingRecord.adminScore || 1.0,
            adminFeedback: existingRecord.adminFeedback || ""
          });
          setChatHistory(existingRecord.chatHistory || []);
        } else {
          setCurrentForm(defaultForm);
          setChatHistory([]);
        }
      }, [activeChar.id, assessmentsList, profName, user, role, selectedRecordId]);

      const handleLogin = async () => {
        setAuthLoading(true);
        setAuthError("");
        try {
          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });
          await signInWithPopup(auth, provider);
        } catch (error) {
          console.error("Login error", error);
          setAuthError(error?.message || "No fue posible iniciar sesion.");
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = async () => {
        await signOut(auth);
        setUser(null);
        setMode("profesor");
        setView("assessment");
        setAssessmentsList([]);
      };

      const callGeminiAPI = async (prompt, inlineData = null, expectJson = false) => {
        setAiError("");

        const apiKey = String(geminiKey || "").trim();
        if (!apiKey) {
          setShowAISettings(true);
          const message = "Para usar la IA, primero configura tu API Key de Gemini desde el boton 'Configurar IA'.";
          return expectJson ? JSON.stringify({ resumen: message, notaSugerida: 0, fortalezas: message, oportunidades: message, planMejoramiento: message }) : message;
        }

        const parts = [];
        if (inlineData) {
          parts.push({
            inline_data: {
              mime_type: inlineData.mimeType,
              data: inlineData.data
            }
          });
        }
        parts.push({ text: prompt });

        const payload = {
          system_instruction: {
            parts: [{
              text: "Actua como experto auditor de acreditacion y calidad de Instituciones de Educacion Superior. Responde siempre en español, con tono tecnico, claro y util."
            }]
          },
          contents: [{ role: "user", parts }],
          generationConfig: {
            temperature: 0.2
          }
        };

        if (expectJson) {
          payload.generationConfig.responseMimeType = "application/json";
        }

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": apiKey
            },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Gemini respondio HTTP ${response.status}: ${errorText.slice(0, 300)}`);
          }

          const result = await response.json();
          const text = result?.candidates?.[0]?.content?.parts?.map(part => part.text || "").join("\n").trim();

          if (!text) throw new Error("Gemini no devolvio texto en la respuesta.");
          return text;
        } catch (error) {
          console.error("Gemini error", error);
          const message = `Error conectando con Gemini: ${error.message}`;
          setAiError(message);
          return expectJson ? JSON.stringify({ resumen: message, notaSugerida: 0, fortalezas: message, oportunidades: message, planMejoramiento: message }) : message;
        }
      };

      const handleFileUpload = async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;

        if (file.size > 10 * 1024 * 1024) {
          alert("El archivo supera 10 MB. Para archivos grandes es mejor usar un backend o Files API.");
          return;
        }

        setCurrentForm(prev => ({ ...prev, isAnalyzingFile: true, fileName: file.name, documentInsights: "" }));

        try {
          const base64String = await toBase64(file);
          const inlineData = { mimeType: file.type || "text/plain", data: base64String };

          const prompt = `Analiza el documento subido como evidencia para la característica: "${activeChar.title}".
Descripcion de la caracteristica: "${activeChar.description}".

Devuelve SOLO un JSON valido con esta estructura:
{
  "resumen": "Resumen exhaustivo y tecnico del documento, incluyendo hallazgos, soporte y relacion con la caracteristica.",
  "notaSugerida": 1
}

La nota sugerida debe ser un entero entre 1 y 5, donde:
1 = Inicial,
2 = En desarrollo,
3 = Consolidado,
4 = Excelente,
5 = Sobresaliente / Lider.

No inventes evidencias que no esten en el documento.`;

          const responseText = await callGeminiAPI(prompt, inlineData, true);
          const parsed = parseAIJson(responseText, {
            resumen: responseText || "No fue posible analizar el documento.",
            notaSugerida: 0
          });

          setCurrentForm(prev => ({
            ...prev,
            isAnalyzingFile: false,
            documentInsights: parsed.resumen || responseText,
            aiSuggestedScore: Number(parsed.notaSugerida || 0)
          }));
        } catch (error) {
          console.error(error);
          setCurrentForm(prev => ({
            ...prev,
            isAnalyzingFile: false,
            documentInsights: `Error leyendo o analizando el archivo: ${error.message}`,
            aiSuggestedScore: 0
          }));
        }
      };

      const handleGenerateDraft = async () => {
        setCurrentForm(prev => ({
          ...prev,
          fortalezas: "Generando fortalezas técnicas...",
          oportunidades: "Generando oportunidades técnicas...",
          planMejoramiento: "Generando plan operativo..."
        }));

        const prompt = `Redacta un diagnostico tecnico para la caracteristica institucional "${activeChar.title}".
Nota de autoevaluacion del profesor: ${currentForm.score}/5.
Resumen de evidencia documental: "${currentForm.documentInsights || 'Sin archivo de soporte'}".

Devuelve SOLO un JSON valido con esta estructura:
{
  "fortalezas": "Fortalezas evidentes y sustentadas.",
  "oportunidades": "Brechas y oportunidades de mejora.",
  "planMejoramiento": "Acciones operativas, responsables sugeridos, productos esperados y seguimiento."
}`;

        const responseText = await callGeminiAPI(prompt, null, true);
        const parsed = parseAIJson(responseText, {});

        setCurrentForm(prev => ({
          ...prev,
          fortalezas: parsed.fortalezas || responseText || "No fue posible generar fortalezas.",
          oportunidades: parsed.oportunidades || "No fue posible generar oportunidades.",
          planMejoramiento: parsed.planMejoramiento || "No fue posible generar plan de mejoramiento."
        }));
      };

      const handleSendChatMessage = async (event) => {
        event.preventDefault();
        if (!chatInput.trim()) return;

        const userMsg = { role: "user", text: chatInput.trim() };
        const newHistory = [...chatHistory, userMsg];
        setChatHistory(newHistory);
        setChatInput("");
        setChatLoading(true);

        const prompt = `Eres un consultor de acreditacion academica.
Caracteristica: "${activeChar.title}".
Descripcion: "${activeChar.description}".
Resumen del documento cargado: "${currentForm.documentInsights || 'No se cargo archivo soporte'}".

Responde con claridad a la consulta del usuario. Historial:
${newHistory.map(m => `${m.role}: ${m.text}`).join("\n")}`;

        const responseText = await callGeminiAPI(prompt);
        setChatHistory([...newHistory, { role: "model", text: responseText }]);
        setChatLoading(false);
        setTimeout(() => chatEndRef.current?.scrollIntoView({ behavior: "smooth" }), 50);
      };

      const handleSaveToFirebase = async () => {
        if (!user) return;
        setIsSaving(true);
        setSaveMessage("");

        try {
          const existingRecord = role === "admin"
            ? assessmentsList.find(a => a.id === selectedRecordId || (a.charId === activeChar.id && a.profName === profName))
            : assessmentsList.find(a => a.charId === activeChar.id && a.userId === user.uid);

          const docId = role === "admin"
            ? existingRecord?.id
            : `${user.uid}_${activeChar.id}`;

          if (role === "admin" && !docId) {
            throw new Error("No se encontro el registro del profesor para calificar.");
          }

          const docRef = doc(db, ...DATA_PATH, docId);

          if (role === "admin") {
            await setDoc(docRef, {
              adminScore: Number(currentForm.adminScore || 1),
              adminFeedback: currentForm.adminFeedback || "",
              reviewedBy: user.uid,
              reviewedByEmail: user.email || "",
              reviewedAt: serverTimestamp(),
              updatedAt: serverTimestamp()
            }, { merge: true });
          } else {
            await setDoc(docRef, {
              userId: user.uid,
              userEmail: user.email || "",
              profName: profName || user.displayName || user.email || "Profesor",
              factorId: activeFactor.id,
              factorTitle: activeFactor.title,
              charId: activeChar.id,
              charTitle: activeChar.title,
              score: Number(currentForm.score || 1),
              aiSuggestedScore: Number(currentForm.aiSuggestedScore || 0),
              fortalezas: currentForm.fortalezas || "",
              oportunidades: currentForm.oportunidades || "",
              planMejoramiento: currentForm.planMejoramiento || "",
              documentInsights: currentForm.documentInsights || "",
              fileName: currentForm.fileName || "",
              chatHistory,
              updatedAt: serverTimestamp()
            }, { merge: true });
          }

          setSaveMessage("Guardado correctamente.");
        } catch (error) {
          console.error("Error guardando", error);
          setSaveMessage(`Error al guardar: ${error.message}`);
        } finally {
          setIsSaving(false);
        }
      };

      const nextChar = () => {
        setSelectedRecordId(null);
        if (activeCharIndex < activeFactor.characteristics.length - 1) setActiveCharIndex(activeCharIndex + 1);
        else if (activeFactorIndex < FULL_DATA.length - 1) { setActiveFactorIndex(activeFactorIndex + 1); setActiveCharIndex(0); }
      };

      const prevChar = () => {
        setSelectedRecordId(null);
        if (activeCharIndex > 0) setActiveCharIndex(activeCharIndex - 1);
        else if (activeFactorIndex > 0) { setActiveFactorIndex(activeFactorIndex - 1); setActiveCharIndex(FULL_DATA[activeFactorIndex - 1].characteristics.length - 1); }
      };

      if (!user) {
        return <LoginScreen onLogin={handleLogin} authLoading={authLoading} authError={authError} />;
      }

      return (
        <div className="min-h-screen bg-gray-50 flex flex-col font-sans text-gray-800">
          {showAISettings && (
            <AISettingsModal
              geminiKey={geminiKey}
              setGeminiKey={setGeminiKey}
              onClose={() => setShowAISettings(false)}
            />
          )}

          <header className="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-20">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3 min-w-0">
                <div className={`p-2 rounded-lg text-white ${role === 'admin' ? 'bg-emerald-600' : 'bg-blue-600'}`}>
                  {role === 'admin' ? <Server size={24} /> : <ShieldCheck size={24} />}
                </div>
                <div className="min-w-0">
                  <h1 className="font-bold text-xl leading-tight truncate">Auto-MAAC Institucional 2025</h1>
                  <p className="text-xs text-gray-500 font-medium truncate">
                    {role === 'admin' ? 'Sesión: Administrador General' : `Sesión: Profesor (${profName})`}
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2 flex-wrap justify-end">
                {isAdmin ? (
                  <div className="flex bg-gray-100 p-1 rounded-lg border border-gray-200">
                    <button
                      onClick={() => { setMode('profesor'); setView('assessment'); setSelectedRecordId(null); setProfName(user.displayName || user.email || "Profesor"); }}
                      className={`px-3 py-1.5 text-xs font-bold rounded-md transition-all ${role === 'profesor' ? 'bg-white shadow text-blue-700' : 'text-gray-500'}`}
                    >
                      Profesor
                    </button>
                    <button
                      onClick={() => { setMode('admin'); setView('adminPanel'); }}
                      className={`px-3 py-1.5 text-xs font-bold rounded-md transition-all ${role === 'admin' ? 'bg-white shadow text-emerald-700' : 'text-gray-500'}`}
                    >
                      Admin
                    </button>
                  </div>
                ) : (
                  <div className="text-xs bg-blue-50 text-blue-700 px-3 py-2 rounded-lg font-bold">Rol: Profesor</div>
                )}

                <button onClick={() => setView('assessment')} className={`px-3 py-2 rounded-md font-medium text-sm flex items-center ${view === 'assessment' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                  <FileText size={16} className="mr-1"/> Autoevaluación
                </button>
                <button onClick={() => setView('dashboard')} className={`px-3 py-2 rounded-md font-medium text-sm flex items-center ${view === 'dashboard' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                  <BarChart2 size={16} className="mr-1"/> Tablero
                </button>
                {isAdmin && (
                  <button onClick={() => { setMode('admin'); setView('adminPanel'); }} className={`px-3 py-2 rounded-md font-medium text-sm flex items-center ${view === 'adminPanel' ? 'bg-emerald-50 text-emerald-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                    <UserCog size={16} className="mr-1"/> Panel Admin
                  </button>
                )}
                <button onClick={() => setShowAISettings(true)} className={`px-3 py-2 rounded-md font-medium text-sm flex items-center ${geminiKey ? 'bg-indigo-50 text-indigo-700' : 'bg-amber-50 text-amber-700'}`}>
                  <KeyRound size={16} className="mr-1"/> IA
                </button>
                <button onClick={handleLogout} className="px-3 py-2 rounded-md font-medium text-sm flex items-center text-gray-600 hover:bg-gray-100">
                  <LogOut size={16} className="mr-1"/> Salir
                </button>
              </div>
            </div>
          </header>

          {aiError && (
            <div className="bg-red-50 border-b border-red-200 text-red-800 text-sm px-4 py-3 flex items-center justify-center gap-2">
              <AlertTriangle size={16} /> {aiError}
            </div>
          )}

          <div className="flex flex-1 overflow-hidden">
            {view === 'assessment' && (
              <>
                <aside className="w-80 bg-white border-r border-gray-200 overflow-y-auto hidden md:block">
                  <div className="p-4 border-b border-gray-100">
                    <h3 className="text-xs font-bold text-gray-400 uppercase mb-3">Navegación de Factores</h3>
                  </div>
                  <ul className="py-2">
                    {FULL_DATA.map((factor, idx) => (
                      <li key={factor.id}>
                        <button
                          onClick={() => { setActiveFactorIndex(idx); setActiveCharIndex(0); setSelectedRecordId(null); }}
                          className={`w-full text-left px-4 py-3 flex items-start gap-3 transition-colors ${activeFactorIndex === idx ? (role === 'admin' ? 'bg-emerald-50 border-emerald-600' : 'bg-blue-50 border-blue-600') + ' border-r-4' : 'hover:bg-gray-50'}`}
                        >
                          <div className={`mt-0.5 ${activeFactorIndex === idx ? (role === 'admin' ? 'text-emerald-600' : 'text-blue-600') : 'text-gray-400'}`}>
                            {factorIcons[idx % factorIcons.length]}
                          </div>
                          <div className="flex-1">
                            <span className={`text-sm font-medium leading-tight ${activeFactorIndex === idx ? 'text-gray-900' : 'text-gray-600'}`}>
                              {factor.title}
                            </span>
                          </div>
                        </button>
                      </li>
                    ))}
                  </ul>
                </aside>

                <main className="flex-1 overflow-y-auto bg-gray-50 p-6">
                  <div className="max-w-4xl mx-auto pb-20">
                    {role === 'admin' && (
                      <div className="bg-emerald-100 border border-emerald-300 text-emerald-800 p-4 rounded-xl mb-4 flex items-center font-bold">
                        <UserCog className="mr-2" /> Modo Administrador: Revisando evaluación de {profName}
                      </div>
                    )}

                    <div className="mb-2 text-sm font-medium text-gray-500 flex items-center">
                      {activeFactor.title} <ChevronRight size={14} className="mx-1"/> Característica {activeCharIndex + 1} de {activeFactor.characteristics.length}
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-6">
                      <h2 className="text-2xl font-bold text-gray-900 mb-3">{activeChar.title}</h2>
                      <p className="text-gray-600 text-sm leading-relaxed mb-4">{activeChar.description}</p>

                      <div className="bg-gray-50 border border-gray-200 rounded-xl p-4 mb-6">
                        <h3 className="font-bold text-gray-700 text-sm mb-2">Evidencias orientadoras</h3>
                        <ul className="list-disc list-inside text-sm text-gray-600 space-y-1">
                          {activeChar.evidences.map((ev, i) => <li key={i}>{ev}</li>)}
                        </ul>
                      </div>

                      <div className="bg-indigo-50 p-5 rounded-xl border border-indigo-100 mb-6 relative">
                        <span className="absolute -top-3 left-4 bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-full">Fase 1: Evidencia & IA</span>
                        <div className="mt-2 mb-3">
                          <h3 className="font-semibold text-indigo-900 text-sm flex items-center">
                            <Upload size={16} className="mr-2 text-indigo-600"/> Copiloto IA: Cargar soporte
                          </h3>
                          <p className="text-xs text-indigo-700 mt-1 mb-3">
                            Carga un PDF, TXT o CSV. La IA elaborará un resumen técnico y sugerirá nivel de madurez.
                          </p>
                        </div>

                        <input
                          type="file"
                          accept=".pdf,.txt,.csv,.md,application/pdf,text/plain,text/csv"
                          onChange={handleFileUpload}
                          disabled={currentForm.isAnalyzingFile || role === 'admin'}
                          className="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer disabled:opacity-50"
                        />

                        {currentForm.isAnalyzingFile && (
                          <div className="mt-4 flex items-center text-sm text-indigo-700 font-medium bg-indigo-100 p-3 rounded-lg animate-pulse">
                            <Loader2 className="animate-spin mr-2" size={18}/> Leyendo documento y calculando sugerencia...
                          </div>
                        )}

                        {currentForm.documentInsights && !currentForm.isAnalyzingFile && (
                          <div className="mt-4 bg-white p-5 rounded-xl border border-indigo-200 shadow-sm">
                            <div className="font-bold text-indigo-900 mb-2 flex items-center text-sm">
                              <Sparkles size={16} className="mr-2 text-amber-500"/> Resumen del Documento: {currentForm.fileName}
                            </div>
                            <div className="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed mb-3">
                              {currentForm.documentInsights}
                            </div>
                            <div className="inline-flex bg-indigo-100 text-indigo-800 px-3 py-1.5 rounded-lg text-sm font-bold items-center">
                              <Award size={16} className="mr-2" /> Nivel sugerido: {currentForm.aiSuggestedScore || 0} / 5
                            </div>
                          </div>
                        )}
                      </div>

                      <div className="mb-6 border border-gray-200 p-5 rounded-xl relative mt-8">
                        <span className="absolute -top-3 left-4 bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full">Fase 2: Calificación Profesor</span>
                        <div className="mt-2">
                          <div className="flex justify-between items-center mb-2">
                            <label className="text-sm font-bold text-gray-800">Medidor de Calificación:</label>
                            <span className={`text-2xl font-extrabold px-3 py-1 rounded-lg bg-white shadow-inner border border-blue-200 ${getScoreTextColor(currentForm.score)}`}>
                              {parseFloat(currentForm.score || 1.0).toFixed(1)} / 5.0
                            </span>
                          </div>

                          <input
                            type="range"
                            min="1.0"
                            max="5.0"
                            step="0.1"
                            value={currentForm.score || 1.0}
                            onChange={(e) => setCurrentForm(p => ({...p, score: parseFloat(e.target.value)}))}
                            disabled={role === 'admin'}
                            className="w-full h-3 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600 focus:outline-none disabled:opacity-50"
                          />

                          <div className="w-full bg-gray-200 rounded-full h-4 overflow-hidden relative border border-gray-300 shadow-sm mt-4">
                            <div className={`h-full transition-all duration-300 ease-out ${getScoreColor(currentForm.score)}`} style={{ width: `${((currentForm.score - 1.0) / 4.0) * 100}%` }} />
                            <span className="absolute inset-0 flex items-center justify-center text-xs font-bold text-gray-700">
                              {getLevelLabel(currentForm.score)}
                            </span>
                          </div>
                        </div>
                      </div>

                      {role === 'admin' && (
                        <div className="mb-6 border-2 border-emerald-400 bg-emerald-50 p-5 rounded-xl relative mt-8">
                          <span className="absolute -top-3 left-4 bg-emerald-600 text-white text-xs font-bold px-3 py-1 rounded-full flex items-center">
                            <CheckSquare size={12} className="mr-1"/> Fase Admin: Nota Final Institucional
                          </span>
                          <div className="mt-2">
                            <div className="flex justify-between items-center mb-2">
                              <label className="text-sm font-bold text-gray-800">Calificación Final:</label>
                              <span className={`text-2xl font-extrabold px-3 py-1 rounded-lg bg-white shadow-inner border border-emerald-200 ${getScoreTextColor(currentForm.adminScore)}`}>
                                {parseFloat(currentForm.adminScore || 1.0).toFixed(1)} / 5.0
                              </span>
                            </div>

                            <input
                              type="range"
                              min="1.0"
                              max="5.0"
                              step="0.1"
                              value={currentForm.adminScore || 1.0}
                              onChange={(e) => setCurrentForm(p => ({...p, adminScore: parseFloat(e.target.value)}))}
                              className="w-full h-3 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-emerald-600 focus:outline-none"
                            />

                            <label className="block text-sm font-bold text-gray-800 mb-2 mt-5">Comentarios del Administrador:</label>
                            <textarea
                              className="w-full p-3 border border-emerald-300 rounded-lg focus:ring-2 focus:ring-emerald-500 text-sm h-24"
                              placeholder="Feedback técnico institucional..."
                              value={currentForm.adminFeedback}
                              onChange={(e) => setCurrentForm(p => ({...p, adminFeedback: e.target.value}))}
                            />
                          </div>
                        </div>
                      )}

                      <div className="border border-gray-200 rounded-xl overflow-hidden mt-8 shadow-sm relative pt-4">
                        <span className="absolute -top-3 left-4 bg-gray-600 text-white text-xs font-bold px-3 py-1 rounded-full z-10">Fase 3: Diagnóstico, Plan & Soporte</span>

                        <div className="flex bg-gray-50 border-b border-gray-200 mt-2">
                          <button onClick={() => setActiveTab('notes')} className={`flex-1 py-3 px-4 text-sm font-semibold flex items-center justify-center gap-2 border-r border-gray-200 transition-colors ${activeTab === 'notes' ? 'bg-white text-blue-700 border-b-2 border-b-blue-600' : 'text-gray-500 hover:text-gray-800'}`}>
                            <ClipboardList size={16} /> Diagnóstico
                          </button>
                          <button onClick={() => setActiveTab('chat')} className={`flex-1 py-3 px-4 text-sm font-semibold flex items-center justify-center gap-2 transition-colors ${activeTab === 'chat' ? 'bg-white text-blue-700 border-b-2 border-b-blue-600' : 'text-gray-500 hover:text-gray-800'}`}>
                            <MessageSquare size={16} /> Consultor IA
                          </button>
                        </div>

                        <div className="p-5 bg-white">
                          {activeTab === 'notes' ? (
                            <div className="space-y-6">
                              <div className="flex justify-between items-center gap-3">
                                <h3 className="text-md font-bold text-gray-700 flex items-center">
                                  <ClipboardList className="mr-2 text-blue-600" size={18} /> Justificación Técnica:
                                </h3>
                                {role === 'profesor' && (
                                  <button onClick={handleGenerateDraft} className="text-xs bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-1.5 rounded-full flex items-center font-bold shadow-sm transition-all">
                                    <Sparkles size={14} className="mr-1" /> Generar borrador IA
                                  </button>
                                )}
                              </div>

                              <div className="bg-emerald-50/50 p-4 rounded-xl border border-emerald-100">
                                <label className="block text-sm font-bold text-emerald-800 mb-2">Fortalezas Encontradas:</label>
                                <textarea disabled={role === 'admin'} className="w-full p-3 text-sm border border-emerald-200 rounded-lg focus:ring-2 focus:ring-emerald-500 bg-white resize-none h-24 text-gray-800 disabled:opacity-85" value={currentForm.fortalezas} onChange={(e) => setCurrentForm(p => ({...p, fortalezas: e.target.value}))} />
                              </div>

                              <div className="bg-amber-50/50 p-4 rounded-xl border border-amber-100">
                                <label className="block text-sm font-bold text-amber-800 mb-2">Oportunidades de Mejora:</label>
                                <textarea disabled={role === 'admin'} className="w-full p-3 text-sm border border-amber-200 rounded-lg focus:ring-2 focus:ring-amber-500 bg-white resize-none h-24 text-gray-800 disabled:opacity-85" value={currentForm.oportunidades} onChange={(e) => setCurrentForm(p => ({...p, oportunidades: e.target.value}))} />
                              </div>

                              <div className="bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                                <label className="block text-sm font-bold text-blue-800 mb-2 flex items-center">
                                  <PlusCircle className="mr-2 text-blue-500" size={16} /> Propuesta de Plan de Mejoramiento:
                                </label>
                                <textarea disabled={role === 'admin'} className="w-full p-3 text-sm border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white resize-none h-28 text-gray-800 disabled:opacity-85" value={currentForm.planMejoramiento} onChange={(e) => setCurrentForm(p => ({...p, planMejoramiento: e.target.value}))} />
                              </div>
                            </div>
                          ) : (
                            <div className="flex flex-col h-96 border border-gray-200 rounded-lg bg-gray-50 overflow-hidden">
                              <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                {chatHistory.length === 0 && (
                                  <div className="text-center text-gray-400 text-sm mt-16">Pregunta sobre el documento, la característica o el proceso de acreditación.</div>
                                )}
                                {chatHistory.map((msg, index) => (
                                  <div key={index} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[85%] rounded-xl p-3 text-sm ${msg.role === 'user' ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white border shadow-sm rounded-tl-none text-gray-800'}`}>
                                      <div className="font-bold text-xs mb-1 opacity-75">{msg.role === 'user' ? 'Tú' : 'Asesor IA'}</div>
                                      <div className="whitespace-pre-wrap">{msg.text}</div>
                                    </div>
                                  </div>
                                ))}
                                {chatLoading && <div className="text-xs text-gray-500 flex items-center"><Loader2 size={12} className="animate-spin mr-1"/> IA escribiendo...</div>}
                                <div ref={chatEndRef} />
                              </div>
                              {role === 'profesor' && (
                                <form onSubmit={handleSendChatMessage} className="bg-white p-2 border-t flex gap-2">
                                  <input type="text" className="flex-1 border rounded-lg px-3 text-sm" placeholder="Consultar con el asesor IA..." value={chatInput} onChange={e => setChatInput(e.target.value)} disabled={chatLoading}/>
                                  <button type="submit" disabled={chatLoading} className="bg-indigo-600 text-white p-2 rounded-lg disabled:bg-gray-400"><Send size={16}/></button>
                                </form>
                              )}
                            </div>
                          )}
                        </div>
                      </div>

                      {saveMessage && (
                        <div className={`mt-5 p-3 rounded-lg text-sm font-medium ${saveMessage.startsWith("Error") ? "bg-red-50 text-red-700 border border-red-200" : "bg-emerald-50 text-emerald-700 border border-emerald-200"}`}>
                          {saveMessage}
                        </div>
                      )}

                      <div className="mt-8 flex justify-end pt-4 border-t border-gray-200">
                        <button
                          onClick={handleSaveToFirebase}
                          disabled={isSaving}
                          className={`px-6 py-3 rounded-xl font-bold text-white shadow-md flex items-center transition-all ${isSaving ? 'bg-gray-400' : role === 'admin' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-blue-600 hover:bg-blue-700'}`}
                        >
                          {isSaving ? <Loader2 size={18} className="animate-spin mr-2"/> : <Save size={18} className="mr-2" />}
                          {isSaving ? 'Guardando...' : role === 'admin' ? 'Guardar Calificación Institucional' : 'Guardar Evaluación'}
                        </button>
                      </div>
                    </div>
                  </div>
                </main>

                <footer className="bg-white border-t border-gray-200 p-4 flex justify-between items-center z-10 sticky bottom-0">
                  <button onClick={prevChar} disabled={activeFactorIndex === 0 && activeCharIndex === 0} className="px-5 py-2.5 rounded-lg font-medium text-sm flex items-center text-gray-600 hover:bg-gray-100 disabled:opacity-30">
                    <ChevronLeft size={18} className="mr-1"/> Anterior
                  </button>
                  <button onClick={nextChar} className={`text-white px-6 py-2.5 rounded-lg font-medium text-sm flex items-center shadow-sm ${role === 'admin' ? 'bg-emerald-600' : 'bg-blue-600'}`}>
                    {activeFactorIndex === FULL_DATA.length - 1 && activeCharIndex === activeFactor.characteristics.length - 1 ? 'Finalizar' : 'Siguiente'}
                    <ChevronRight size={18} className="ml-1"/>
                  </button>
                </footer>
              </>
            )}

            {view === 'dashboard' && (
              <div className="flex-1 overflow-y-auto w-full">
                <Dashboard
                  assessmentsList={assessmentsList}
                  onNavigate={(idx) => { setActiveFactorIndex(idx); setActiveCharIndex(0); setSelectedRecordId(null); setView('assessment'); }}
                  onCallAI={callGeminiAPI}
                  isAdmin={isAdmin}
                  onOpenAISettings={() => setShowAISettings(true)}
                />
              </div>
            )}

            {view === 'adminPanel' && (
              <div className="flex-1 overflow-y-auto w-full bg-gray-50">
                <AdminPanel
                  assessmentsList={assessmentsList}
                  isAdmin={isAdmin}
                  onReview={(record, fIdx, cIdx) => {
                    setMode('admin');
                    setProfName(record.profName || record.userEmail || "Profesor");
                    setSelectedRecordId(record.id);
                    setActiveFactorIndex(fIdx);
                    setActiveCharIndex(cIdx);
                    setView('assessment');
                  }}
                />
              </div>
            )}
          </div>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMessage: "" };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, errorMessage: error?.message || "Error desconocido" };
      }

      componentDidCatch(error, errorInfo) {
        console.error("Error de render en React:", error, errorInfo);
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-red-50 text-red-900 flex items-center justify-center p-6">
              <div className="max-w-2xl bg-white rounded-xl shadow-lg border border-red-200 p-6">
                <h1 className="text-2xl font-bold mb-3">La aplicación no pudo cargar</h1>
                <p className="text-sm mb-4">Revisa la consola del navegador para ver el detalle técnico.</p>
                <pre className="bg-red-100 rounded p-3 text-xs whitespace-pre-wrap">{this.state.errorMessage}</pre>
              </div>
            </div>
          );
        }

        return this.props.children;
      }
    }

    try {
      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <ErrorBoundary>
          <AutoevaluacionMAAC />
        </ErrorBoundary>
      );
    } catch (error) {
      console.error("Error crítico al iniciar la aplicación:", error);
      document.getElementById('root').innerHTML = `
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fef2f2;color:#991b1b;font-family:Arial;padding:24px;">
          <div style="max-width:720px;background:#fff;border:1px solid #fecaca;border-radius:12px;padding:24px;box-shadow:0 10px 25px rgba(0,0,0,.08);">
            <h1 style="font-size:24px;margin:0 0 12px;font-weight:700;">La aplicación no pudo iniciar</h1>
            <p style="margin:0 0 16px;">Revisa la consola del navegador. Error:</p>
            <pre style="white-space:pre-wrap;background:#fee2e2;padding:12px;border-radius:8px;font-size:12px;">${error.message}</pre>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
